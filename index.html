<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#222c2a">
  <meta name="description" content="AL · Un mar de peonías con pétalos flotando y una dedicatoria en caligrafía.">
  <title>AL · Un mar de peonías</title>
  <!-- Tipografía caligráfica; en modo sin conexión se usan alternativas cursivas del sistema. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@500;600&display=swap" rel="stylesheet">
  <style>
:root{--night:#8fb9c4;--paper:#fff4e8;--ink:#6d4860;--sage:#6b8f69;--soft:#cfe3b6;--pink:#efb8c5}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--night)}
body{font-family:Georgia,'Times New Roman',serif;-webkit-font-smoothing:antialiased}
.scene{position:relative;width:100%;height:100dvh;min-height:340px;overflow:hidden;isolation:isolate;background:linear-gradient(180deg,#9ed0e8 0%,#cde9f6 28%,#fff0dc 64%,#b6d8a2 100%);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.scene>div,.scene>canvas{pointer-events:none}
.paper-scene,.intro-background,.garden-field,.digital-scene,.flash,#effects,.final-message{position:absolute;inset:0}
.paper-scene{z-index:0;opacity:0;transition:opacity 2.4s ease 0.15s;background:linear-gradient(180deg,#9fd0ea 0%,#d7edf7 24%,#fff3e2 56%,#d8edc8 100%)}
.paper-grain{position:absolute;inset:0;opacity:.36;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='180' height='180' filter='url(%23n)' opacity='.11'/%3E%3C/svg%3E");mix-blend-mode:multiply}
.sun-disc{position:absolute;width:min(46vw,470px);aspect-ratio:1;top:9%;left:50%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,#fff8ec 0 42%,#ffe7b8 57%,rgba(255,239,190,.35) 67%,transparent 78%);opacity:.92;filter:blur(.2px)}
.distant-hill{position:absolute;left:-15%;width:130%;border-radius:50% 50% 0 0}
.hill-a{top:54%;height:33%;background:#dff0d6;transform:rotate(-5deg)}
.hill-b{top:60%;height:34%;background:#c8ddb7;transform:rotate(6deg)}
.hill-c{top:67%;height:46%;background:#8eb57e;transform:rotate(-3deg)}
.meadow{position:absolute;inset:auto 0 0;height:24%;background:linear-gradient(180deg,#8fbb7f,#62905f)}
.intro-background{z-index:1;transition:opacity 1.9s ease}
.halo-ring{position:absolute;top:50%;left:50%;border:1px dashed rgba(255,246,219,.34);border-radius:50%;transform:translate(-50%,-50%)}
.ring-one{width:min(76vw,580px);aspect-ratio:1}
.ring-two{width:min(97vw,760px);aspect-ratio:1}
.code-rule{position:absolute;width:2px;height:36%;top:32%;background:linear-gradient(transparent,rgba(255,240,210,.12),rgba(255,255,255,.55),rgba(255,240,210,.12),transparent)}
.rule-one{left:18%}.rule-two{right:18%}
.garden-field{z-index:4;overflow:hidden;opacity:0;transition:opacity 1.6s ease}
.digital-scene{z-index:6;display:grid;place-items:center;transition:opacity 1.7s ease,transform 2.4s cubic-bezier(.2,.5,.2,1)}
.digital-aura{position:absolute;top:50%;left:50%;width:min(76vw,610px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,250,235,.7) 0,rgba(255,222,194,.28) 38%,rgba(255,255,255,0) 72%)}
.binary-flower{position:absolute;left:50%;top:50%;width:clamp(265px,37vw,425px);aspect-ratio:1;opacity:0;transform:translate(-50%,-50%) scale(.48);transition:opacity 1s ease,transform 5.2s cubic-bezier(.18,.68,.18,1)}
.flower-wire,.flower-real{position:absolute;inset:0}
.flower-wire svg,.flower-real svg{display:block;width:100%;height:100%;overflow:visible}
.flower-wire{filter:drop-shadow(0 0 6px rgba(217,237,226,.2))}
.flower-real{opacity:0;clip-path:inset(100% 0 0 0)}
.orbit{position:absolute;left:50%;top:50%;width:min(54vw,520px);height:min(54vw,520px);border:2px dashed rgba(255,240,206,.5);border-radius:50%;opacity:0;transform:translate(-50%,-50%) rotate(23deg) scaleY(.35)}
.orbit-two{width:min(65vw,620px);height:min(65vw,620px);transform:translate(-50%,-50%) rotate(-31deg) scaleY(.35)}
.flash{z-index:8;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(255,248,227,1) 0,rgba(255,241,222,.76) 10%,rgba(255,247,230,.12) 46%,transparent 71%)}
#effects{z-index:9;width:100%;height:100%;display:block}
.final-message{z-index:11;display:grid;justify-items:center;align-items:start;opacity:0;transform:translateY(11px);transition:opacity 2.8s ease,transform 2.8s ease}
.message-copy{position:relative;z-index:1;max-width:800px;width:100%;text-align:center;padding:clamp(32px,6vh,70px) 18px 0;color:#6b4a62;text-shadow:0 2px 10px rgba(255,255,255,.32)}
.message-copy h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-style:normal;letter-spacing:.09em;line-height:1.16;font-size:clamp(86px,10vw,148px);margin:0;padding:0 14px 3px}
.divider-decoration{display:flex;justify-content:center;align-items:center;gap:13px;margin:8px auto 13px;opacity:.72}
.divider-decoration span{height:1px;width:clamp(34px,6vw,82px);background:#785365}
.divider-decoration i{font-weight:normal;font-style:normal;font-size:16px;line-height:1}
.message-copy p{font-family:"Dancing Script","Segoe Script","Brush Script MT",cursive;font-weight:500;font-style:italic;font-size:clamp(24px,2.8vw,37px);line-height:1.23;margin:0;letter-spacing:.005em}
.replay{z-index:25;position:absolute;right:max(19px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));display:grid;place-items:center;width:46px;height:46px;padding:11px;background:rgba(255,249,238,.88);color:#6b7e68;border:1px solid rgba(99,125,95,.16);border-radius:50%;opacity:0;transform:translateY(12px);transition:opacity 1.2s ease,transform 1.2s ease;box-shadow:0 10px 28px rgba(80,105,77,.12);cursor:pointer}
.replay svg{width:100%;height:100%}
.replay:hover{background:#fff7e8}
.replay:focus-visible{outline:3px solid #7c8c71;outline-offset:3px}
.sound{z-index:25;position:absolute;left:max(19px,env(safe-area-inset-left));bottom:max(20px,env(safe-area-inset-bottom));display:grid;place-items:center;width:46px;height:46px;padding:11px;background:rgba(255,249,238,.88);color:#6b7e68;border:1px solid rgba(99,125,95,.16);border-radius:50%;box-shadow:0 10px 28px rgba(80,105,77,.12);cursor:pointer}
.sound svg{width:100%;height:100%}
.verses{position:absolute;left:50%;bottom:max(26px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(640px,calc(100% - 150px));padding:18px 26px 15px;text-align:center;color:#5e3f55;background:rgba(255,249,238,.86);border:1px solid rgba(120,83,101,.14);border-radius:22px;box-shadow:0 14px 40px rgba(80,105,77,.16)}
.verses figure{margin:0}
.verses blockquote{margin:0;font-family:Georgia,"Times New Roman",serif;font-style:italic}
.verses figcaption{font-family:"Dancing Script","Segoe Script","Brush Script MT",cursive;font-weight:600;color:#7c5a6e}
.verse-rotator{display:grid}
.verse-rotator figure{grid-area:1/1;align-self:center;opacity:0;transition:opacity 1.4s ease}
.verse-rotator figure.active{opacity:1}
.verse-rotator blockquote{font-size:clamp(16px,1.5vw,19px);line-height:1.45}
.verse-rotator figcaption{margin-top:6px;font-size:clamp(20px,1.9vw,24px)}
.giraffes{position:absolute;inset:0;z-index:5;overflow:hidden;opacity:0;transition:opacity 1.4s ease .8s}
.scene.blooming .giraffes{opacity:1}
.giraffe{position:absolute;left:0;top:0;transform-origin:50% 100%;will-change:transform}
.giraffe .flip{width:100%;height:100%;transition:transform .45s ease}
.giraffe.left .flip{transform:scaleX(-1)}
.giraffe svg{display:block;width:100%;height:100%;overflow:visible}
.g-leg{transform-box:fill-box;transform-origin:50% 0}
.giraffe.walking .g-leg.a{animation:gStep var(--step,.56s) ease-in-out infinite alternate}
.giraffe.walking .g-leg.b{animation:gStep var(--step,.56s) ease-in-out infinite alternate-reverse}
.giraffe.walking .g-upper{animation:gBob calc(var(--step,.56s) / 2) ease-in-out infinite alternate}
.g-tail{transform-box:fill-box;transform-origin:90% 0;animation:gTail 1.5s ease-in-out infinite alternate}
.g-head{transform-box:fill-box;transform-origin:30% 90%;animation:gNod 2.8s ease-in-out infinite alternate}
.g-eyes{transform-box:fill-box;transform-origin:50% 55%;animation:gBlink 4.6s ease-in-out infinite}
@keyframes gBlink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}97%{transform:scaleY(1)}}
@keyframes gStep{from{transform:rotate(-17deg)}to{transform:rotate(17deg)}}
@keyframes gBob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes gTail{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}
@keyframes gNod{from{transform:rotate(-5deg)}to{transform:rotate(6deg)}}
.opener{position:absolute;inset:0;z-index:40;display:grid;place-items:center;align-content:center;gap:14px;width:100%;border:0;padding:24px;margin:0;cursor:pointer;color:#6b4a62;font:inherit;background:radial-gradient(circle at 50% 42%,#fff8ec 0,#fde9e4 38%,#cfe6f2 100%);transition:opacity 1.1s ease,visibility 1.1s ease}
.opener.gone{opacity:0;visibility:hidden;pointer-events:none}
.opener img{width:clamp(120px,22vw,190px);height:auto;animation:openerPulse 2.6s ease-in-out infinite}
.opener .op-title{font-family:"Great Vibes","Dancing Script","Segoe Script",cursive;font-size:clamp(46px,8vw,78px);line-height:1}
.opener .op-hint{font-family:"Dancing Script","Segoe Script",cursive;font-size:clamp(20px,2.6vw,26px);padding:8px 22px;border-radius:999px;background:rgba(255,255,255,.66);border:1px solid rgba(120,83,101,.18)}
.opener:focus-visible .op-hint{outline:3px solid #7c8c71;outline-offset:3px}
@keyframes openerPulse{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.07) rotate(3deg)}}
.sound:hover{background:#fff7e8}
.sound:focus-visible{outline:3px solid #7c8c71;outline-offset:3px}
.sound .off{display:none}
.sound.muted .on{display:none}
.sound.muted .off{display:block}
.sr-only{position:absolute;clip:rect(0 0 0 0);width:1px;height:1px;overflow:hidden;white-space:nowrap}
.plant{position:absolute;left:var(--x);top:var(--y);width:var(--w);height:var(--h);transform:translateX(-50%);transform-origin:bottom center;opacity:1;will-change:opacity}
.plant.canopy .stem-art{display:none}
.plant.canopy::before,.plant.canopy::after{content:"";position:absolute;z-index:0;width:34%;height:18%;left:17%;top:37%;border-radius:100% 8% 90% 15%;background:linear-gradient(145deg,#b4d39b,#5e9472);transform:rotate(-30deg);filter:drop-shadow(0 2px 2px rgba(67,115,68,.14))}
.plant.canopy::after{left:51%;transform:scaleX(-1) rotate(-30deg);background:linear-gradient(115deg,#d3dfaa,#75a67b)}
.plant .stem-art{position:absolute;left:11%;top:29%;width:78%;height:72%;transform-origin:50% 100%;transform:scaleY(0);opacity:0;overflow:visible}
.plant .head{position:absolute;left:-5%;top:-10%;width:110%;aspect-ratio:1;transform-origin:50% 63%;transform:translateY(26px) rotate(-18deg) scale(.02);opacity:0}
.plant .head img{width:100%;height:100%;display:block}
.plant:not(.back) .head img{animation:flowerSway 5.4s ease-in-out infinite alternate;animation-delay:var(--sway)}
.scene.digital-start .binary-flower{opacity:1;transform:translate(-50%,-50%) scale(1)}
.scene.digital-start .orbit{opacity:.7;animation:orbitGlow 4s ease-in-out infinite alternate}
.scene.digital-fill .flower-real{animation:becomeReal 3.4s cubic-bezier(.4,0,.2,1) forwards}
.scene.digital-fill .flower-wire{transition:opacity 2.1s ease 1.1s;opacity:.12}
.scene.digital-fill .binary-flower{transform:translate(-50%,-50%) scale(1.14)}
.scene.burst .flash{animation:burstFlash 1.55s ease-out forwards}
.scene.burst .digital-scene{opacity:0;transform:scale(1.45)}
.scene.blooming .paper-scene{opacity:1}
.scene.blooming .intro-background{opacity:0}
.scene.blooming .garden-field{opacity:1}
.scene.blooming .plant.canopy .stem-art{display:none}
.plant.canopy::before,.plant.canopy::after{content:"";position:absolute;z-index:0;width:34%;height:18%;left:17%;top:37%;border-radius:100% 8% 90% 15%;background:linear-gradient(145deg,#b4d39b,#5e9472);transform:rotate(-30deg);filter:drop-shadow(0 2px 2px rgba(67,115,68,.14))}
.plant.canopy::after{left:51%;transform:scaleX(-1) rotate(-30deg);background:linear-gradient(115deg,#d3dfaa,#75a67b)}
.plant .stem-art{animation:stemRise 1.05s cubic-bezier(.15,.77,.2,1) var(--delay) both}
.scene.blooming .plant .head{animation:headOpen 2.4s cubic-bezier(.13,.65,.24,1.04) calc(var(--delay) + .42s) both}
.scene.blooming .plant.canopy .head{animation:headOpen 2.6s cubic-bezier(.16,.74,.21,1) calc(var(--delay) + .5s) both}
.scene.message-on .final-message{opacity:1;transform:translateY(0)}
.scene.message-on .replay{opacity:1;transform:translateY(0)}
@keyframes orbitGlow{from{opacity:.15}to{opacity:.6}}
@keyframes becomeReal{0%{opacity:0;clip-path:inset(100% 0 0 0);transform:scale(.82)}35%{opacity:.72}100%{opacity:1;clip-path:inset(0 0 0 0);transform:scale(1)}}
@keyframes burstFlash{0%{opacity:0;transform:scale(.12)}17%{opacity:1}36%{opacity:.5}100%{opacity:0;transform:scale(2.3)}}
@keyframes stemRise{0%{opacity:0;transform:scaleY(0)}22%{opacity:1}80%{opacity:1;transform:scaleY(1.04)}100%{opacity:1;transform:scaleY(1)}}
@keyframes headOpen{0%{opacity:0;transform:translateY(24px) rotate(-20deg) scale(.02)}18%{opacity:1}52%{transform:translateY(-4px) rotate(6deg) scale(1.12,.9)}72%{transform:translateY(-2px) rotate(-2deg) scale(.96,1.08)}100%{opacity:1;transform:translateY(0) rotate(0deg) scale(1)}}
@keyframes flowerSway{from{transform:rotate(-1.8deg) translate(-1px,0)}to{transform:rotate(1.8deg) translate(1px,-2px)}}
@keyframes flowerBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.touch-bloom{position:absolute;z-index:10;width:clamp(78px,13vw,160px);height:clamp(78px,13vw,160px);pointer-events:none;transform:translate(-50%,-50%) scale(0);opacity:0;animation:touchFlourish 3.5s cubic-bezier(.15,.7,.3,1) forwards}
.touch-bloom img{height:100%;width:100%}
@keyframes touchFlourish{0%{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(-25deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.04) rotate(4deg)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-75%) scale(1.16)}}
@media(max-width:700px){.sun-disc{width:82vw;top:13%}.hill-a{top:56%}.hill-b{top:62%}.hill-c{top:69%}.binary-flower{width:min(81vw,380px);top:49%}.orbit,.digital-aura{top:49%}.orbit{width:84vw;height:84vw}.orbit-two{width:108vw;height:108vw}.message-copy{padding-top:clamp(24px,5vh,60px)}.message-copy h1{font-size:clamp(64px,17vw,96px)}.message-copy p{max-width:360px;margin:auto;font-size:clamp(21px,5.4vw,27px)}.verses{width:calc(100% - 24px);bottom:calc(max(18px,env(safe-area-inset-bottom)) + 56px);padding:12px 15px 10px;border-radius:18px}.verse-rotator blockquote{font-size:14.5px;line-height:1.4}.verse-rotator figcaption{font-size:19px;margin-top:3px}.message-copy p .desktop-only{display:none}.divider-decoration{margin:7px auto 12px}.sun-disc{opacity:.62}.replay{right:16px;bottom:max(18px,env(safe-area-inset-bottom))}}
@media(max-height:780px) and (min-width:701px){.message-copy{padding-top:22px}.message-copy h1{font-size:clamp(70px,9vw,112px)}.message-copy p{font-size:clamp(22px,2.4vw,30px)}.divider-decoration{margin:4px auto 8px}}
@media(max-height:550px) and (min-width:701px){.verses{padding:9px 18px 8px;bottom:12px}.verse-rotator blockquote{font-size:13.5px}.verse-rotator figcaption{font-size:17px;margin-top:2px}.message-copy{padding-top:17px}.message-copy h1{font-size:71px}.message-copy p{font-size:24px}.divider-decoration{margin:1px auto 5px}.binary-flower{width:min(70vh,360px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

</style>
</head>
<body>
  <main id="scene" class="scene" aria-label="Jardín muy abundante de peonías animadas en muchos colores para AL">
    <div class="paper-scene" aria-hidden="true">
      <div class="paper-grain"></div>
      <div class="sun-disc"></div>
      <div class="distant-hill hill-a"></div>
      <div class="distant-hill hill-b"></div>
      <div class="distant-hill hill-c"></div>
      <div class="meadow"></div>
    </div>
    <div class="intro-background" aria-hidden="true">
      <span class="halo-ring ring-one"></span>
      <span class="halo-ring ring-two"></span>
      <span class="code-rule rule-one"></span>
      <span class="code-rule rule-two"></span>
    </div>
    <div id="gardenField" class="garden-field" aria-hidden="true"></div>
    <div id="giraffes" class="giraffes" aria-hidden="true"></div>
    <div id="digitalScene" class="digital-scene" aria-hidden="true">
      <div class="digital-aura"></div>
      <div class="binary-flower">
        <div class="flower-wire" id="flowerWire"></div>
        <div class="flower-real" id="flowerReal"></div>
      </div>
      <div class="orbit orbit-one"></div>
      <div class="orbit orbit-two"></div>
    </div>
    <div class="flash" aria-hidden="true"></div>
    <canvas id="effects" aria-hidden="true"></canvas>
    <div class="final-message" aria-hidden="true">
      <div class="message-copy">
        <h1>AL</h1>
        <div class="divider-decoration"><span></span><i>✳</i><span></span></div>
        <p>Simplemente porque eres bonita,<br class="desktop-only"> pensé en ti.</p>
      </div>
      <div class="verses">
        <div class="verse-rotator" id="verseRotator"></div>
      </div>
    </div>
    <button type="button" class="replay" id="replay" aria-label="Volver a ver florecer el jardín" title="Volver a florecer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.8 6.5"/><path d="M3 4v7h7"/></svg>
    </button>
    <button type="button" class="sound muted" id="sound" aria-label="Activar música" title="Música">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 6 6"/><path d="m22 9-6 6"/></svg>
    </button>
    <audio id="music" src="cancion.mp3" loop preload="auto"></audio>
    <button type="button" class="opener" id="opener" aria-label="Abrir la sorpresa con música" autofocus>
      <img id="openerFlower" alt="" draggable="false">
      <span class="op-title">Para AL</span>
      <span class="op-hint">Toca para abrir ♪</span>
    </button>
    <span class="sr-only" id="announcement" aria-live="polite"></span>
  </main>
  <script>
/*
 * AL · Jardín de peonías
 * Sin dependencias. Flores SVG generadas con JavaScript y partículas Canvas 2D.
 * Abre index.html o publica la carpeta en GitHub Pages.
 */
(() => {
  'use strict';
  const scene = document.getElementById('scene');
  const field = document.getElementById('gardenField');
  const wire = document.getElementById('flowerWire');
  const real = document.getElementById('flowerReal');
  const replay = document.getElementById('replay');
  const canvas = document.getElementById('effects');
  const announcement = document.getElementById('announcement');
  const ctx = canvas.getContext('2d', { alpha: true });
  if (!ctx) return;

  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mobile = matchMedia('(max-width: 700px)').matches;
  const flowerColors = ['#f5a9bf', '#ffd3dd', '#fff0cf', '#cbb5f4', '#ffbf92', '#d86a87', '#ffa7ba', '#ffe1a8', '#ffdfe5', '#ee87a7', '#fff4de', '#f7c3ff', '#f4a4b5', '#e4bddc', '#fbd1a7', '#ffe9ee'];
  const svgCache = new Map();
  const timeouts = [];
  let particles = [];
  let phase = 'idle';
  let startAt = 0;
  let lastFrame = 0;
  let lastPetal = 0;
  let messageAt = 14.2; // segundos hasta que aparece la dedicatoria con las citas
  let w = 1, h = 1, dpr = 1;
  let seed = 73;

  const rng = () => {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  };
  const random = (min, max) => min + (max - min) * rng();
  const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
  const mix = (hexA, hexB, f) => {
    const a = hexA.replace('#', ''), b = hexB.replace('#', '');
    const ch = (i) => Math.round(parseInt(a.slice(i, i + 2), 16) * (1 - f) + parseInt(b.slice(i, i + 2), 16) * f);
    return '#' + [0, 2, 4].map(i => ch(i).toString(16).padStart(2, '0')).join('');
  };

  // Capas de pétalos con diferentes proporciones y pliegues: no imágenes de flores prefabricadas.
  function petalPath(width, length, lean) {

    return `M 0 9 C ${num(-a * .18)} ${num(-b * .18)} ${num(-a * .86)} ${num(-b * .52)} ${num(-a * .84 + s)} ${num(-b * .76)} ` +
      `C ${num(-a * .84 + s)} ${num(-b * 1.05)} ${num(-a * .50)} ${num(-b * 1.14)} ${num(-a * .21)} ${num(-b * .97)} ` +
      `Q ${num(-a * .015)} ${num(-b * 1.17)} ${num(a * .20)} ${num(-b * .98)} ` +
      `C ${num(a * .46)} ${num(-b * 1.13)} ${num(a * .83 + s)} ${num(-b * 1.02)} ${num(a * .87 + s)} ${num(-b * .77)} ` +
      `C ${num(a * .90)} ${num(-b * .48)} ${num(a * .16)} ${num(-b * .13)} 0 9 Z`;

  function peonySVG(color, variant, wireMode = false) {
    const key = [color, variant, wireMode].join('|');
    if (svgCache.has(key)) return svgCache.get(key);
    const highlight = mix(color, '#ffffff', .63);
    const light = mix(color, '#fff8ed', .40);
    const shade = mix(color, '#532b50', .50);
    const deep = mix(color, '#5c193c', .68);
    const id = 'p' + color.slice(1) + variant + (wireMode ? 'w' : 'r');
    const defs = `<defs>
      <radialGradient id="${id}under" cx="50%" cy="44%" r="65%"><stop stop-color="${light}"/><stop offset=".68" stop-color="${color}"/><stop offset="1" stop-color="${shade}"/></radialGradient>
      <linearGradient id="${id}0" x1=".5" y1="1" x2=".5" y2="0"><stop stop-color="${shade}"/><stop offset=".39" stop-color="${color}"/><stop offset=".71" stop-color="${light}"/><stop offset="1" stop-color="${highlight}"/></linearGradient>
      <linearGradient id="${id}1" x1="0" y1="1" x2="1" y2="0"><stop stop-color="${deep}"/><stop offset=".46" stop-color="${color}"/><stop offset=".80" stop-color="${light}"/><stop offset="1" stop-color="${highlight}"/></linearGradient>
      <linearGradient id="${id}2" x1="1" y1="1" x2=".1" y2="0"><stop stop-color="${shade}"/><stop offset=".55" stop-color="${light}"/><stop offset="1" stop-color="${highlight}"/></linearGradient>
      <radialGradient id="${id}sh"><stop stop-color="#566139" stop-opacity=".2"/><stop offset=".75" stop-color="#566139" stop-opacity=".08"/><stop offset="1" stop-color="#566139" stop-opacity="0"/></radialGradient>
    </defs>`;
    // Sombra suave dibujada dentro del SVG (más ligera que un filtro CSS en cientos de flores).
    const shadow = wireMode ? '' : `<ellipse cx="0" cy="14" rx="108" ry="100" fill="url(#${id}sh)"/>`;
    const rings = [
      {count: 14, rad: 36, width: 28, length: 60},
      {count: 17, rad: 23, width: 25, length: 52},
      {count: 15, rad: 12, width: 19, length: 39},
      {count: 11, rad: 2, width: 14, length: 29}
    ];
    let petals = '';
    rings.forEach((ring, ri) => {
      for (let i = 0; i < ring.count; i++) {
        const p = ((i * 23 + ri * 17 + variant * 31) % 13) / 13;
        const variation = (p - .5) * 9;
        const rot = 360 / ring.count * (i + ((ri % 2) ? .5 : 0)) + variation;
        const radius = ring.rad + variation * .48;
        const wide = ring.width * (1 + (p - .5) * .27);
        const long = ring.length * (1 + (p - .5) * .22);
        const d = petalPath(wide, long, (p - .5) * 7);
        const fill = wireMode ? 'rgba(211,235,213,.016)' : `url(#${id}${(i + ri) % 3})`;
        const stroke = wireMode ? 'rgba(197,230,210,.82)' : mix(color, '#6e3b53', .23);
        const thickness = wireMode ? 1.0 : .36;
        petals += `<g transform="rotate(${num(rot)}) translate(0 ${num(-radius)}) rotate(${num(variation * .45)})">` +
          `<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-opacity="${wireMode ? 1 : .48}" stroke-width="${thickness}"/>` +
          (wireMode ? '' : `<path d="M0 2 Q${num(-wide * .10)} ${num(-long * .43)} ${num(-wide * .05)} ${num(-long * .83)}" fill="none" stroke="${highlight}" stroke-opacity=".35" stroke-width=".8"/>`) +
          `</g>`;
      }
    });
    let center = '';
    if (!wireMode) {
      center = `<circle r="15" fill="url(#${id}under)"/>`;
      for (let i = 0; i < 23; i++) {
        const rad = i * Math.PI * 2 / 23;
        const r = 7.5 + (i % 4) * 1.8;
        const x = Math.cos(rad) * r, y = Math.sin(rad) * r;
        center += `<path d="M${num(x*.6)} ${num(y*.6)} L${num(x)} ${num(y)}" stroke="#db9f43" stroke-width="1.25"/>`;
        center += `<circle cx="${num(x)}" cy="${num(y)}" r="${i % 4 === 0 ? 1.9 : 1.2}" fill="${i % 3 ? '#ffe9a0' : '#ffe2ac'}"/>`;
      }
      center += `<circle r="3.5" fill="#ffedb0" opacity=".87"/>`;
    } else {
      center = `<circle r="12" fill="none" stroke="#d1e6cf" stroke-dasharray="3 3"/>`;
    }
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-128 -128 256 256" aria-hidden="true">${defs}${shadow}${petals}${center}</svg>`;
    svgCache.set(key, svg);
    return svg;
  }

      const svg = peonySVG(col, Math.floor(rng()*4));

        g.rest -= dt;
        if (g.rest <= 0) { pickTarget(g); g.state = 'walk'; }
      } else {
        const dx = g.tx - g.x, dy = g.ty - g.y, d = Math.hypot(dx, dy);
        if (d < 3) { g.state = 'rest'; g.rest = 1 + Math.random() * 2.5; }
        else {
          const step = Math.min(d, g.speedK * g.H * dt);
          g.x += dx / d * step; g.y += dy / d * step;
          if (Math.abs(dx) > 2) g.left = dx < 0;
        }
      }
      placeGiraffe(g);
    }
  }

  function digitParticle() {
    const theta = random(0, Math.PI * 2);
    const radius = random(80, mobile ? 230 : 305);
    const x = centerX() + Math.cos(theta) * radius;
    const y = centerY() + Math.sin(theta) * radius * .8;
    return {type:'binary',x,y,age:0,life:random(1.2,3.2),vx:-(x-centerX())*random(.12,.32),vy:-(y-centerY())*random(.12,.32),wave:random(0,6.28),size:[12,15,18][Math.floor(rng()*3)],glyph:rng()<.5?'0':'1',alpha:random(.4,.94)};
  }
  function petalParticle(x, y, burst=false) {
    const a = random(0, Math.PI*2), speed = random(100, mobile ? 450 : 580);
    return {type:'petal',x,y,age:0,life:burst?random(2.1,6.3):random(5,11),vx:burst?Math.cos(a)*speed:random(-28,36),vy:burst?Math.sin(a)*speed-random(20,95):random(21,67),rotation:random(0,6.28),rotV:random(-2.2,2.2),size:random(3,burst?13:11),color:flowerColors[Math.floor(rng()*flowerColors.length)],burst};
  }
  function glitterParticle(x, y, burst=false) {
    const a = random(0,6.283), speed=random(110,800);
    return {type:'spark',x,y,age:0,life:random(.6,2.3),vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,size:random(1,3.4),burst};
  }
  function explode() {
    phase = 'burst';
    const total = mobile ? 170 : 290;
    for (let i=0;i<total;i++) particles.push(i%4===0 ? glitterParticle(centerX(),centerY(),true) : petalParticle(centerX(),centerY(),true));
  }
  function drawPetal(p) {
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.rotation);
    ctx.scale(1, .73 + .2*Math.sin(p.age*5));
    const s=p.size;
    ctx.beginPath();
    ctx.moveTo(0,s*.7);
    ctx.bezierCurveTo(-s*1.5,-s*.3,-s*.75,-s*1.15,0,-s*1.4);
    ctx.bezierCurveTo(s*.9,-s*1.15,s*1.3,-s*.13,0,s*.7);
    ctx.closePath();
    ctx.fillStyle=p.color;
    ctx.fill();
    ctx.beginPath();ctx.moveTo(0,s*.5);ctx.quadraticCurveTo(s*.15,-s*.15,0,-s*1.12);
    ctx.strokeStyle='rgba(255,248,235,.42)';ctx.lineWidth=.75;ctx.stroke();
    ctx.restore();
  }
  function drawParticles(dt, now) {
    const t = (now - startAt) / 1000;
    if (phase==='code' && !reducedMotion) {
      for(let i=0;i<(mobile?2:3);i++)particles.push(digitParticle());
      if(rng()<.38)particles.push(glitterParticle(centerX()+random(-140,140),centerY()+random(-140,140)));
    }
    if ((phase==='garden' || phase==='done') && !reducedMotion && now-lastPetal > (mobile ? 160 : 110)) {
      for(let n = 0; n < (mobile ? 2 : 3); n++) {
        particles.push(petalParticle(random(-30,w+30),random(-90,-12)));
      }
      lastPetal=now;
    }
    const cap = mobile ? 300 : 460;
    if (particles.length > cap) particles.splice(0,particles.length - cap);
    ctx.clearRect(0,0,w,h);
    ctx.textAlign='center';ctx.textBaseline='middle';
    let currentFont = '';
    for (let i=particles.length-1;i>=0;i--) {
      const p=particles[i];p.age+=dt;
      if(p.age>p.life){particles.splice(i,1);continue;}
      const k=p.age/p.life;
      p.x+=p.vx*dt;
      p.y+=p.vy*dt;
      if(p.type==='petal') {
        p.vy+=(p.burst?120:6)*dt;
        p.vx+=Math.sin(t*1.4+p.rotation)*2*dt;
        p.rotation+=p.rotV*dt;
        ctx.globalAlpha=clamp(Math.min(k*6,(1-k)*4),0,.93);
        drawPetal(p);
      } else if(p.type==='binary') {
        ctx.globalAlpha=Math.sin(Math.PI*k)*p.alpha;
        const font=`${p.size}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
        if (font!==currentFont) { ctx.font=font; currentFont=font; }
        ctx.fillStyle=k<.5?'#6fb8e6':'#f3d98f';
        ctx.fillText(p.glyph,p.x+Math.sin(t*2+p.wave)*5,p.y);
      } else {
        // Destello sin shadowBlur (muy costoso): un halo tenue y un punto brillante.
        const r=p.size*(1-k*.65);
        ctx.globalAlpha=(1-k)*.28;
        ctx.fillStyle='#f2d8bd';
        ctx.beginPath();ctx.arc(p.x,p.y,r*2.4,0,6.283);ctx.fill();
        ctx.globalAlpha=(1-k)*.9;
        ctx.fillStyle='#fff8e7';
        ctx.beginPath();ctx.arc(p.x,p.y,r,0,6.283);ctx.fill();
      }
    }
    ctx.globalAlpha=1;
  }
  function frame(now) {
    requestAnimationFrame(frame);
    if(now-lastFrame<25)return;
    const dt=clamp((now-lastFrame)/1000,0,.05);
    lastFrame=now;
    drawParticles(dt,now);
    updateGiraffes(dt);
  }
  function later(fn, ms){timeouts.push(setTimeout(fn,ms));}
  function replayAnimation() {
    timeouts.forEach(clearTimeout);timeouts.length=0;
    seed=14071;particles=[];phase='code';startAt=performance.now();lastPetal=0;
    scene.className='scene';
    announcement.textContent='Comienza a formarse una peonía hecha de código binario.';
    addPlants();
    resetGiraffes();
    wire.innerHTML=peonySVG('#b3d2bc',8,true);
    real.innerHTML=peonySVG('#e8a7b0',8,false);
    // Forzar reinicio de las animaciones CSS de todos los elementos.
    void scene.offsetWidth;
    messageAt = reducedMotion ? 0 : 14.2;
    if (reducedMotion) {
      scene.classList.add('blooming','message-on','is-complete');
      document.querySelectorAll('.plant .stem-art').forEach(n=>{n.style.opacity='1';n.style.transform='scaleY(1)';});
      document.querySelectorAll('.plant .head').forEach(n=>{n.style.opacity='1';n.style.transform='scale(1)';});
      phase='done';
      return;
    }
    later(()=>scene.classList.add('digital-start'),250);
    later(()=>scene.classList.add('digital-fill'),2800);
    later(()=>{scene.classList.add('burst');explode();},5800);
    later(()=>{phase='garden';scene.classList.add('blooming');},6800);
    later(()=>{scene.classList.add('message-on');announcement.textContent='AL. Simplemente porque eres bonita, pensé en ti.';},14200);
    later(()=>{scene.classList.add('is-complete');phase='done';},19200);
  }
  function addTouchFlower(x,y) {
    if (phase!=='garden' && phase!=='done')return;
    const bloom=document.createElement('div');
    bloom.className='touch-bloom';
    bloom.style.left=x+'px';bloom.style.top=y+'px';
    const col=flowerColors[Math.floor(rng()*flowerColors.length)];
    bloom.innerHTML=`<img alt="" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(peonySVG(col,Math.floor(rng()*4)))}">`;
    scene.appendChild(bloom);
    bloom.addEventListener('animationend',()=>bloom.remove(),{once:true});
    for(let i=0;i<19;i++)particles.push(petalParticle(x,y,true));
  }
  // Citas bíblicas (Reina-Valera 1960). Isaías 62:4 va primero; después se reparten a lo largo de toda la canción.
  const verses = [
    ['Nunca más te llamarán Desamparada, ni tu tierra se dirá más Desolada; sino que serás llamada Hefzi-bá, y tu tierra, Beula; porque el amor de Jehová estará en ti, y tu tierra será desposada.', 'Isaías 62:4'],
    ['Jehová está en medio de ti, poderoso, él salvará; se gozará sobre ti con alegría, callará de amor, se regocijará sobre ti con cánticos.', 'Sofonías 3:17'],
    ['Toda tú eres hermosa, amiga mía, y en ti no hay mancha.', 'Cantares 4:7'],
    ['Con amor eterno te he amado; por tanto, te prolongué mi misericordia.', 'Jeremías 31:3'],
    ['Te alabaré; porque formidables, maravillosas son tus obras; estoy maravillado, y mi alma lo sabe muy bien.', 'Salmos 139:14'],
    ['Porque a mis ojos fuiste de gran estima, fuiste honorable, y yo te amé.', 'Isaías 43:4'],
    ['Dios está en medio de ella; no será conmovida. Dios la ayudará al clarear la mañana.', 'Salmos 46:5'],
    ['Muchas mujeres hicieron el bien; mas tú sobrepasas a todas.', 'Proverbios 31:29'],
    ['Jehová te bendiga, y te guarde; Jehová haga resplandecer su rostro sobre ti, y tenga de ti misericordia.', 'Números 6:24-25'],
    ['Porque yo sé los pensamientos que tengo acerca de vosotros, dice Jehová, pensamientos de paz, y no de mal, para daros el fin que esperáis.', 'Jeremías 29:11'],
    ['He aquí que en las palmas de las manos te tengo esculpida.', 'Isaías 49:16'],
    ['No temas, porque yo estoy contigo; no desmayes, porque yo soy tu Dios que te esfuerzo; siempre te ayudaré, siempre te sustentaré con la diestra de mi justicia.', 'Isaías 41:10'],
    ['Fuerza y honor son su vestidura; y se ríe de lo por venir.', 'Proverbios 31:25'],
    ['Todo lo hizo hermoso en su tiempo.', 'Eclesiastés 3:11'],
    ['Deléitate asimismo en Jehová, y él te concederá las peticiones de tu corazón.', 'Salmos 37:4'],
    ['Por la misericordia de Jehová no hemos sido consumidos, porque nunca decayeron sus misericordias. Nuevas son cada mañana; grande es tu fidelidad.', 'Lamentaciones 3:22-23'],
    ['Mi amado habló, y me dijo: Levántate, oh amiga mía, hermosa mía, y ven.', 'Cantares 2:10'],
    ['Porque los montes se moverán, y los collados temblarán, pero no se apartará de ti mi misericordia, ni el pacto de mi paz se quebrantará.', 'Isaías 54:10'],
    ['Los que miraron a él fueron alumbrados, y sus rostros no fueron avergonzados.', 'Salmos 34:5'],
    ['El amor es sufrido, es benigno; el amor no tiene envidia, el amor no es jactancioso, no se envanece.', '1 Corintios 13:4'],
    ['Y sabemos que a los que aman a Dios, todas las cosas les ayudan a bien.', 'Romanos 8:28'],
    ['Jehová es mi pastor; nada me faltará.', 'Salmos 23:1'],
    ['Doy gracias a mi Dios siempre que me acuerdo de vosotros.', 'Filipenses 1:3']
  ];
  const rotator = document.getElementById('verseRotator');
  const verseNodes = verses.map(([text, ref], i) => {
    const fig = document.createElement('figure');
    if (i === 0) fig.className = 'active';
    const q = document.createElement('blockquote');
    q.textContent = '«' + text + '»';
    const cap = document.createElement('figcaption');
    cap.textContent = ref;
    fig.append(q, cap);
    rotator.appendChild(fig);
    return fig;
  });
  const music = document.getElementById('music');
  // Cada cita dura lo mismo, de modo que todas caben en la duración de la canción.
  let verseIndex = 0;
  const showVerse = (i) => {
    if (i === verseIndex) return;
    verseNodes[verseIndex].classList.remove('active');
    verseIndex = i;
    verseNodes[verseIndex].classList.add('active');
  };
  setInterval(() => {
    if (phase === 'idle') return;
    const songLen = isFinite(music.duration) && music.duration > 60 ? music.duration : messageAt + verses.length * 13;
    // Posición en la canción: el reloj del audio si está sonando; si la pausaron, el tiempo transcurrido.
    const t = !music.paused ? music.currentTime : ((performance.now() - startAt) / 1000) % songLen;
    const slot = (songLen - messageAt) / verses.length;
    const i = t < messageAt ? 0 : Math.floor((t - messageAt) / slot);
    showVerse(Math.min(i, verses.length - 1));
  }, 400);

  // Música: arranca junto con la animación al abrir la sorpresa.
  const soundBtn = document.getElementById('sound');
  music.volume = .75;
  let userMuted = false;
  const syncSound = () => {
    const off = music.paused;
    soundBtn.classList.toggle('muted', off);
    soundBtn.setAttribute('aria-label', off ? 'Activar música' : 'Pausar música');
  };
  const playMusic = () => music.play().then(syncSound).catch(syncSound);
  music.addEventListener('play', syncSound);
  music.addEventListener('pause', syncSound);
  soundBtn.addEventListener('click',(e)=>{
    e.stopPropagation();
    if (music.paused) { userMuted = false; playMusic(); } else { userMuted = true; music.pause(); }
  });
  const restartAll = () => {
    music.currentTime = 0;
    if (!userMuted) playMusic();
    replayAnimation();
  };

  // Los navegadores no dejan sonar música sin un toque, así que la pantalla de entrada
  // hace que la canción y la animación empiecen exactamente al mismo tiempo.
  const opener = document.getElementById('opener');
  document.getElementById('openerFlower').src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(peonySVG('#f5a9bf', 2));
  let opened = false;
  const openGift = () => {
    if (opened) return;
    opened = true;
    opener.classList.add('gone');
    restartAll();
  };
  opener.addEventListener('click', (e) => { e.stopPropagation(); openGift(); });
  // Si el navegador sí permite el sonido automático, empieza de inmediato sin pedir el toque.
  music.play().then(openGift).catch(() => {});

  replay.addEventListener('click',(e)=>{e.stopPropagation();restartAll();});
  scene.addEventListener('pointerdown',(e)=>{
    if(e.target.closest('#replay, #sound'))return;
    addTouchFlower(e.clientX,e.clientY);
  });
  window.addEventListener('resize',setSize,{passive:true});
  setSize();
  frame(performance.now());
})();

</script>
</body>
</html>
